# Render 一键部署配置（Blueprints）
# 用法：Render Dashboard → New → Blueprint → 选择本仓库 → 依次填入密钥即可
services:
  - type: web
    name: slowdata-intel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    disk:
      name: slowdata-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DASHBOARD_TOKEN
        value: ""
      - key: SLOWDATA_DATA_DIR
        value: /data
      # 公开只读（无口令、禁止触发运行）；本地嵌入模型在 512MB 内存下自动降级为标题去重
      - key: SLOWDATA_READONLY
        value: "1"
      - key: SLOWDATA_NO_EMBED
        value: "1"
