{% extends "base.html" %}
{% block title %}日报 · 慢数据情报台{% endblock %}
{% block content %}
<h1>日报</h1>
{% if reports %}
  <table>
    <tr><th>日期</th><th>大小</th><th>修改时间</th><th></th></tr>
    {% for r in reports %}
    <tr>
      <td>{{ r.date }}</td>
      <td>{{ (r.size/1024)|round(1) }} KB</td>
      <td>{{ r.mtime|int|default(0) }}</td>
      <td><a href="/reports/{{ r.date }}">阅读</a></td>
    </tr>
    {% endfor %}
  </table>
{% else %}
  <p class="muted">暂无日报，先到 <a href="/runs">运行</a> 页触发一次。</p>
{% endif %}
{% endblock %}
