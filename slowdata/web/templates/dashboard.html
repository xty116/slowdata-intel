{% extends "base.html" %}
{% block title %}概览 · 慢数据情报台{% endblock %}
{% block content %}
<div class="page-head">
  <h1>情报概览</h1>
  <span class="sub">数据实时取自本地沉淀库</span>
</div>

<div class="grid cols-4" id="stat-cards">
  <div class="card stat"><div class="num" id="s-items">…</div><div class="label">📦 条目</div></div>
  <div class="card stat"><div class="num" id="s-entities">…</div><div class="label">🏢 实体</div></div>
  <div class="card stat"><div class="num" id="s-events">…</div><div class="label">⚡ 事件</div></div>
  <div class="card stat"><div class="num" id="s-claims">…</div><div class="label">🔍 断言核验</div></div>
</div>

<div class="grid cols-2" style="margin-top:16px">
  <div class="card">
    <h3>💰 近 14 天 LLM 成本（USD）</h3>
    <div class="chart" id="chart-cost"></div>
  </div>
  <div class="card">
    <h3>🎯 最新一次 Critic 五维评分</h3>
    <div class="chart" id="chart-radar"></div>
  </div>
</div>

<div class="grid cols-2" style="margin-top:16px">
  <div class="card">
    <h3>📡 各信源贡献（最新运行）</h3>
    <div class="chart" id="chart-source"></div>
  </div>
  <div class="card">
    <h3>🚀 运行状态
      <span class="sub" id="run-pill"></span>
      <button class="sm ghost" id="btn-trigger" style="float:right">▶ 立即运行</button>
      <input type="number" id="trigger-mq" min="1" max="20" placeholder="检索上限(默认12)" style="float:right;width:130px;margin-right:8px;padding:4px 8px;font-size:12px">
    </h3>
    <div class="kv" id="run-detail"><span class="muted">加载中…</span></div>
    <div id="run-live" style="margin-top:8px"></div>
    <h3 style="margin-top:14px">📰 最近日报</h3>
    <ul class="linklist" id="report-list"></ul>
    <h3 style="margin-top:14px">🕘 最近运行</h3>
    <div class="table-wrap"><table id="recent-runs"></table></div>
  </div>
</div>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
