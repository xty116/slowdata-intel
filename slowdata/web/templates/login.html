<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 慢数据情报台</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 360px; text-align: center; }
  .login-card input { width: 100%; text-align: center; font-size: 15px; padding: 12px; margin: 14px 0; }
  .login-card button { width: 100%; padding: 12px; font-size: 15px; }
  .err { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand" style="justify-content:center;font-size:20px;margin-bottom:6px">🐢 慢数据情报台</div>
    <div class="muted">请输入访问口令</div>
    <form method="post" action="/login">
      <input type="password" name="token" placeholder="访问口令" autofocus required>
      <button type="submit">进入看板</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </div>
</div>
</body>
</html>
